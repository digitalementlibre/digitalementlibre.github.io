<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajouter au calendrier</title>
<body style="font-family:-apple-system,sans-serif;text-align:center;padding:40px 20px;background:#fdf0f4;color:#5c2e26">
<p id="t" style="font-size:20px"></p>
<a id="go" style="display:inline-block;margin-top:20px;padding:18px 30px;border-radius:30px;background:#c8145a;color:#fff;font-size:20px;text-decoration:none">+ Ajouter au calendrier</a>
<script>
var p=new URLSearchParams(location.search),d=(p.get('d')||'').replace(/\D/g,''),en=p.get('l')==='en';
var M=en?['January','February','March','April','May','June','July','August','September','October','November','December']:['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
document.getElementById('t').textContent=(en?'New event on ':'Nouveau rendez-vous le ')+(+d.slice(6))+' '+M[+d.slice(4,6)-1]+' '+d.slice(0,4);
var u='U'+Date.now()+Math.random().toString(36).slice(2)+'@digitalementlibre';
var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Digitalement Libre//Planner//FR','BEGIN:VEVENT','UID:'+u,'DTSTAMP:'+d+'T080000Z','DTSTART:'+d+'T090000','DTEND:'+d+'T100000','SUMMARY:'+(en?'My event':'Mon rendez-vous'),'END:VEVENT','END:VCALENDAR',''].join('\r\n');
var g=document.getElementById('go');g.textContent=en?'+ Add to calendar':'+ Ajouter au calendrier';
g.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);g.download=d+'.ics';
</script></body></html>
